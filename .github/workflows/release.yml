name: Release desktop app

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.platform }} (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            asset_name_pattern: AGY-BYOK_[version]_macOS-Apple-Silicon[ext]
          - platform: macos-14
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            asset_name_pattern: AGY-BYOK_[version]_macOS-Intel[ext]
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            asset_name_pattern: AGY-BYOK_[version]_Windows-x64[ext]

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate updater signing configuration
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "Missing repository secret: TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          }
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || {
            echo "Missing repository variable: TAURI_UPDATER_PUBLIC_KEY" >&2
            exit 1
          }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: app-v__VERSION__
          releaseName: AGY BYOK v__VERSION__
          releaseBody: |
            请按设备选择安装包：

            - macOS Apple Silicon（M 系列）：下载名称包含 `macOS-Apple-Silicon` 的 DMG
            - macOS Intel：下载名称包含 `macOS-Intel` 的 DMG
            - Windows 64 位：下载 EXE

            其余文件由应用自动更新使用，无需手动下载。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.asset_name_pattern }}
          uploadWorkflowArtifacts: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: false

  finalize-updater:
    name: Finalize updater manifest
    needs: publish
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rewrite updater URLs to public release links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_tag="app-v$(jq -r '.version' package.json)"
          release_json="$RUNNER_TEMP/release.json"
          assets_json="$RUNNER_TEMP/assets.json"
          latest_json="$RUNNER_TEMP/latest.json"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" > "$release_json"
          release_id="$(jq -r '.id' "$release_json")"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$assets_json"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP" \
            --clobber

          python3 - "$latest_json" "$assets_json" "$GITHUB_REPOSITORY" "$release_tag" <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import quote

          latest_path, assets_path, repository, release_tag = sys.argv[1:]
          latest = json.loads(Path(latest_path).read_text())
          assets = {
              str(asset["id"]): asset["name"]
              for asset in json.loads(Path(assets_path).read_text())
          }
          api_marker = "/releases/assets/"

          for platform, entry in latest.get("platforms", {}).items():
              url = entry.get("url", "")
              if api_marker not in url:
                  continue
              asset_id = url.split(api_marker, 1)[1].split("?", 1)[0]
              asset_name = assets.get(asset_id)
              if asset_name is None:
                  raise RuntimeError(
                      f"Missing release asset for {platform}: {asset_id}"
                  )
              entry["url"] = (
                  f"https://github.com/{repository}/releases/download/"
                  f"{release_tag}/{quote(asset_name)}"
              )

          expected_suffixes = {
              "darwin-aarch64": "_macOS-Apple-Silicon.app.tar.gz",
              "darwin-aarch64-app": "_macOS-Apple-Silicon.app.tar.gz",
              "darwin-x86_64": "_macOS-Intel.app.tar.gz",
              "darwin-x86_64-app": "_macOS-Intel.app.tar.gz",
              "windows-x86_64": "_Windows-x64.exe",
              "windows-x86_64-nsis": "_Windows-x64.exe",
          }
          for platform, suffix in expected_suffixes.items():
              entry = latest.get("platforms", {}).get(platform)
              if entry is None:
                  raise RuntimeError(f"Missing updater platform entry: {platform}")
              url = entry.get("url", "")
              if "api.github.com" in url or api_marker in url:
                  raise RuntimeError(f"Updater URL is not public for {platform}: {url}")
              if not url.endswith(suffix):
                  raise RuntimeError(
                      f"Updater asset does not match {platform}: {url}"
                  )

          Path(latest_path).write_text(
              json.dumps(latest, ensure_ascii=False, indent=2) + "\n"
          )
          PY

          gh release upload "$release_tag" "$latest_json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
