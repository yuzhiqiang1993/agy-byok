<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="128" y1="88" x2="900" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f0f7"/>
    </linearGradient>
    <linearGradient id="badge" x1="312" y1="198" x2="716" y2="826" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2168ee"/>
      <stop offset="0.55" stop-color="#2581dd"/>
      <stop offset="1" stop-color="#05a6a4"/>
    </linearGradient>
    <linearGradient id="badgeHighlight" x1="374" y1="250" x2="652" y2="732" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#052d68" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="capsule" x1="420" y1="592" x2="604" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8f5ff"/>
      <stop offset="1" stop-color="#b9f1e7"/>
    </linearGradient>
    <filter id="tileShadow" x="-18%" y="-18%" width="136%" height="144%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6f8194" flood-opacity="0.2"/>
    </filter>
    <filter id="badgeShadow" x="-18%" y="-18%" width="136%" height="144%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#174783" flood-opacity="0.2"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="72" y="72" width="880" height="880" rx="214"/>
    </clipPath>
  </defs>

  <!-- Clean macOS-style tile, matching the app's light surface. -->
  <g filter="url(#tileShadow)">
    <rect x="72" y="72" width="880" height="880" rx="214" fill="url(#tile)"/>
    <rect x="73.5" y="73.5" width="877" height="877" rx="212.5" fill="none" stroke="#d7e2ec" stroke-width="3"/>
  </g>
  <g clip-path="url(#tileClip)" opacity="0.58">
    <path d="M72 72H952V322C818 242 668 214 512 214C352 214 202 244 72 328V72Z" fill="#ffffff"/>
  </g>

  <!-- Blue/teal gateway badge. -->
  <g filter="url(#badgeShadow)">
    <path d="M512 166L748 302V592C748 704 664 790 512 858C360 790 276 704 276 592V302L512 166Z" fill="url(#badge)"/>
    <path d="M512 190L721 310V585C721 677 649 748 512 812C375 748 303 677 303 585V310L512 190Z" fill="none" stroke="#dff8ff" stroke-opacity="0.3" stroke-width="5"/>
    <path d="M512 190L721 310V585C721 677 649 748 512 812C375 748 303 677 303 585V310L512 190Z" fill="url(#badgeHighlight)"/>
  </g>

  <!-- White inner face keeps the mark readable at desktop and dock sizes. -->
  <path d="M512 268L651 348V568C651 634 598 688 512 731C426 688 373 634 373 568V348L512 268Z" fill="#ffffff" fill-opacity="0.98"/>
  <path d="M512 282L637 354V560C637 615 592 662 512 704C432 662 387 615 387 560V354L512 282Z" fill="#f8fbff"/>

  <!-- Product and purpose: brand above, BYOK as the primary readable cue. -->
  <text x="512" y="434" text-anchor="middle" fill="#5e83ad" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="750" letter-spacing="10">AGY</text>
  <text x="512" y="548" text-anchor="middle" fill="#153966" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="2">BYOK</text>

  <!-- Minimal model-routing cue: three providers behind one local key gateway. -->
  <g>
    <rect x="414" y="596" width="196" height="56" rx="28" fill="url(#capsule)" stroke="#ffffff" stroke-opacity="0.82" stroke-width="4"/>
    <path d="M447 624H577" fill="none" stroke="#4384c4" stroke-opacity="0.66" stroke-width="7" stroke-linecap="round"/>
    <circle cx="447" cy="624" r="10" fill="#2168ee"/>
    <rect x="494" y="610" width="36" height="28" rx="14" fill="#244c86"/>
    <circle cx="512" cy="624" r="5" fill="#ffffff"/>
    <circle cx="577" cy="624" r="10" fill="#05a6a4"/>
    <circle cx="447" cy="624" r="4" fill="#ffffff"/>
    <circle cx="577" cy="624" r="4" fill="#ffffff"/>
  </g>
</svg>
